<title>Touchline Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: analyst workbench. Sticky app bar + filter row, then a responsive card grid.
   Pitch diagrams are the hero material; type is condensed sports display over a plain humanist body. */
:root {
  --bg: #f1f3f0;
  --surface: #fbfcfa;
  --surface-2: #e9ede8;
  --ink: #111713;
  --ink-2: #485350;
  --muted: #747e78;
  --rule: #dce1db;
  --rule-2: #c3cbc4;
  --pitch: #e6ece5;
  --pitch-line: #a9b6ac;
  --accent: #b3121c;
  --accent-ink: #ffffff;
  --team-a: #e34948;
  --team-b: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b; --good-text: #006300; --bad-text: #b02a2a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d110f; --surface: #151a17; --surface-2: #1d2420; --ink: #edf1ed; --ink-2: #b6bfb8; --muted: #86908a;
    --rule: #252d28; --rule-2: #36413a; --pitch: #18211c; --pitch-line: #3e4d44; --accent: #ef5350; --accent-ink: #0d110f;
    --team-a: #e66767; --team-b: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
    --good-text: #3fbf3f; --bad-text: #f07575;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d110f; --surface: #151a17; --surface-2: #1d2420; --ink: #edf1ed; --ink-2: #b6bfb8; --muted: #86908a;
  --rule: #252d28; --rule-2: #36413a; --pitch: #18211c; --pitch-line: #3e4d44; --accent: #ef5350; --accent-ink: #0d110f;
  --team-a: #e66767; --team-b: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
  --good-text: #3fbf3f; --bad-text: #f07575;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .tnum { font-variant-numeric: tabular-nums; }

/* ---------- App bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }
.brand svg { width: 30px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule-2); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.chip.real .dot { background: var(--good); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field label, .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
select { background: var(--surface); border: 1px solid var(--rule-2); border-radius: 4px; padding: 5px 28px 5px 9px; max-width: 100%; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; padding: 5px 11px; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; padding: 9px 12px 10px; font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

/* ---------- Content ---------- */
main { padding-block: 20px 60px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); align-items: start; }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card.span { grid-column: 1 / -1; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-h h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.card-h p, .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; max-width: 70ch; }

.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; margin-bottom: 16px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-size: clamp(38px, 7vw, 64px); font-weight: 700; line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; }
.hero .meta { color: var(--ink-2); font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.form { display: inline-flex; gap: 4px; }
.form span { width: 22px; height: 22px; border-radius: 3px; display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: #fff; }
.form .W { background: var(--good); } .form .D { background: var(--muted); } .form .L { background: var(--bad); }

.kpis { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.kpi { background: var(--surface); padding: 12px 14px; }
.kpi .v { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; margin-top: 4px; }
.kpi .v small { font-size: 16px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.kpi .r { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kpi .r b { color: var(--ink-2); font-weight: 600; }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 6px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
th.sortable { cursor: pointer; user-select: none; }
th.sorted { color: var(--ink); }
th.sorted::after { content: " ▾"; }
th.l, td.l { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tr.focus td { background: color-mix(in srgb, var(--team-a) 12%, var(--surface)); font-weight: 600; }
tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--team-a); }
td .pos { color: var(--muted); font-size: 12px; margin-left: 6px; }
.badge { display: inline-block; min-width: 34px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; padding: 1px 5px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); margin-right: 8px; }

/* ---------- Tactics ---------- */
.board { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(240px, 1fr); gap: 20px; align-items: start; }
.xi { display: flex; flex-direction: column; gap: 10px; }

.xi-unit:last-of-type { border-bottom: 0; }

.xi-row .badge { flex: none; }
.xi-name { display: flex; flex-direction: column; min-width: 0; }
.xi-name a { color: var(--ink); font-weight: 600; text-decoration: none; }
.xi-name a:hover { text-decoration: underline; }

.subs { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
@media (max-width: 820px) { .board { grid-template-columns: 1fr; } }

/* ---------- Opponents ---------- */
.wdl { display: flex; gap: 1px; width: 110px; height: 12px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.wdl.wide { width: 100%; height: 16px; margin-top: 4px; }
.wdl div { min-width: 0; }
.wdl .W { background: var(--good); } .wdl .D { background: var(--muted); } .wdl .L { background: var(--bad); }
.opp-table th.grp { text-align: center; border-bottom: 1px solid var(--rule-2); color: var(--ink-2); }

/* ---------- Match timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 13.5px; }
.timeline li { display: grid; grid-template-columns: 38px 10px 56px 1fr; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.tl-min { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; }
.tl-kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.tl-goal .tl-kind, .tl-goal .tl-text { color: var(--ink); font-weight: 700; }
.tl-red .tl-kind { color: var(--bad-text); }
.prose pre.cmd { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 8px 10px; border-radius: 4px; overflow-x: auto; white-space: pre; margin: 6px 0; }

/* ---------- Charts ---------- */
svg { display: block; }
.pitch { width: 100%; height: auto; max-width: 100%; }
.pitch.half { max-height: 520px; margin: 0 auto; }
.pitch .bg { fill: var(--pitch); }
.pitch .ln { fill: none; stroke: var(--pitch-line); stroke-width: 0.4; }
.pitch .spot { fill: var(--pitch-line); }
.pitch .dir { fill: var(--muted); font-size: 2.6px; font-family: var(--font-body); }
.axis text, .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.axis line, .grid-line { stroke: var(--rule); stroke-width: 1; }
.baseline { stroke: var(--rule-2); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 16px; }
.legend i.ring { border-radius: 50%; border: 2px solid currentColor; background: transparent; }
.twin { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.twin h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.statline { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.statline div { display: flex; flex-direction: column; }
.statline b { font-family: var(--font-display); font-size: 24px; line-height: 1; }
.statline span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.stackbar { display: flex; gap: 2px; height: 30px; border-radius: 4px; overflow: hidden; }
.stackbar div { display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; }
.stackbar div.dk { color: #0b0b0b; }
.phase-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.phase-row .eyebrow { line-height: 1.2; }

.hbars { display: flex; flex-direction: column; gap: 7px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 86px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .track { position: relative; height: 16px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; }
.hbar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; }
.hbar .val small { color: var(--muted); }

.fly { display: flex; flex-direction: column; gap: 4px; }
.fly-row { display: grid; grid-template-columns: 1fr minmax(110px, 160px) 1fr; gap: 8px; align-items: center; font-size: 13px; }
.fly-row .lab { text-align: center; color: var(--ink-2); font-size: 12.5px; line-height: 1.2; }
.fly-side { display: flex; align-items: center; gap: 6px; }
.fly-side.l { flex-direction: row-reverse; }
.fly-side .trk { flex: 1; display: flex; min-width: 0; }
.fly-side.l .trk { justify-content: flex-end; }
.fly-side .b { height: 14px; border-radius: 3px; min-width: 2px; }
.fly-side.l .b { border-radius: 3px 0 0 3px; }
.fly-side.r .b { border-radius: 0 3px 3px 0; }
.fly-side .v { font-variant-numeric: tabular-nums; min-width: 42px; }
.fly-side.l .v { text-align: right; }
.fly-side .v.win { font-weight: 700; }
.fly-head { display: grid; grid-template-columns: 1fr minmax(110px, 160px) 1fr; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.fly-head div:first-child { text-align: right; }

.pct { display: flex; flex-direction: column; gap: 6px; }
.pct-row { display: grid; grid-template-columns: minmax(120px, 42%) 1fr; gap: 10px; align-items: center; font-size: 13px; }
.pct-bars { display: flex; flex-direction: column; gap: 3px; }
.pct-bar { display: grid; grid-template-columns: 1fr 78px; gap: 8px; align-items: center; }
.pct-bar .trk { position: relative; height: 13px; background: var(--surface-2); border-radius: 0 3px 3px 0; }
.pct-bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 3px 3px 0; }
.pct-bar .t { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pct-row .nm small { color: var(--muted); display: block; font-size: 11.5px; }

.funnel { display: flex; flex-direction: column; gap: 6px; }

.mlist { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 74px 30px 1fr auto 74px; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--rule); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; font-size: 13.5px; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-current="true"] { background: color-mix(in srgb, var(--team-a) 12%, var(--surface)); box-shadow: inset 3px 0 0 var(--team-a); }
.mrow .score { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.mrow .xg { color: var(--muted); font-size: 12px; text-align: right; }
.mrow .d { color: var(--muted); font-size: 12px; }
.res { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 13px; }
.res.W { background: var(--good); } .res.D { background: var(--muted); } .res.L { background: var(--bad); }

.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; margin-bottom: 4px; }
.scoreboard .tn { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 3.5vw, 30px); text-transform: uppercase; line-height: 1; }
.scoreboard .tn.r { text-align: right; }
.scoreboard .sc { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 6vw, 56px); line-height: 1; }
.scoreboard .xgs { font-size: 13px; color: var(--muted); margin-top: 4px; }

.profile-h { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; margin-bottom: 12px; }
.profile-h h2 { margin: 0; font-family: var(--font-display); font-size: 30px; text-transform: uppercase; line-height: 1; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

.btn { background: var(--ink); color: var(--bg); border: 0; padding: 8px 14px; border-radius: 4px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule-2); }
.drop { border: 2px dashed var(--rule-2); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--surface-2); }
.prose { max-width: 72ch; }
.prose p, .prose li { color: var(--ink-2); }
.prose h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 17px; margin: 18px 0 6px; }
.prose code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.prose a { color: var(--c1); text-underline-offset: 2px; overflow-wrap: anywhere; }
.saved { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.saved .sub { margin-top: 2px; }
textarea { width: 100%; font-family: var(--font-mono); font-size: 12px; line-height: 1.4; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 4px; padding: 8px; resize: vertical; white-space: pre; }
.status { margin-top: 10px; font-size: 13.5px; }
.status.err { color: var(--bad-text); }
.status.ok { color: var(--good-text); }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 4px; font-size: 12.5px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
.tip .tv { font-weight: 700; font-size: 14px; }
.tip .tl { opacity: 0.75; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

@media (max-width: 640px) {
  .filters { margin-left: 0; width: 100%; }
  .filters .field { flex: 1 1 140px; }
  .filters select { width: 100%; }
  .mrow { grid-template-columns: 62px 26px 1fr auto; }
  .mrow .xg { display: none; }
  .hbar { grid-template-columns: 1fr 1fr 56px; }
  .phase-row { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill, .fly-side .b, .pct-bar .fill { transition: width 0.35s ease; }
}

<script>
'use strict';
/* =====================================================================
   Touchline Lab engine
   - One event model for every source (StatsBomb-style: 120 x 80 yards,
     each team's events in its own frame, attacking left -> right).
   - Demo season generator (synthetic, seeded) and StatsBomb JSON import.
   - Metrics: team & player aggregates, possession phases, densities.
   ===================================================================== */

const PL = 120, PW = 80;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) {
  let u = 0, v = 0;
  while (!u) u = r();
  while (!v) v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ---------- Formations: in-possession base positions (team frame) ---------- */
const FORMATIONS = {
  '4-2-3-1': [['GK', 6, 40], ['RB', 36, 70], ['RCB', 26, 52], ['LCB', 26, 28], ['LB', 36, 10], ['RDM', 48, 48], ['LDM', 48, 32], ['RW', 78, 68], ['AM', 76, 40], ['LW', 78, 12], ['ST', 94, 40]],

function xgOf(x, y, head) {
  const dx = Math.max(0.5, PL - x), dy = Math.abs(y - 40);
  const d = Math.hypot(dx, dy);
  let a = Math.atan2(8 * dx, dx * dx + dy * dy - 16);
  if (a < 0) a += Math.PI;
  let lg = -1.55 + 1.7 * a - 0.085 * d;
  if (head) lg -= 0.9;
  return clamp(1 / (1 + Math.exp(-lg)), 0.01, 0.92);
}

function buildDemo(seed = 20262027) {
  const R = mulberry32(seed);
  const teams = DEMO_TEAMS.map((t) => ({ id: t.id, name: t.name, style: t }));
  const players = {};
  const squads = {};
  const used = new Set();
  let pid = 0;
  const pick = (a) => a[Math.floor(R() * a.length)];
  const newName = () => { for (;;) { const n = pick(FIRST) + ' ' + pick(LAST); if (!used.has(n)) { used.add(n); return n; } } };

  for (const t of DEMO_TEAMS) {
    const sq = [];
    const nums = new Set([1]);
    const num = () => { for (;;) { const n = 2 + Math.floor(R() * 34); if (!nums.has(n)) { nums.add(n); return n; } } };
    const mk = (group, role, rank) => {
      const p = {
        id: 'p' + pid++, team: t.id, name: newName(), num: group === 'GK' && rank === 0 ? 1 : num(), group, role, rank,
        q: clamp(t.q + gauss(R) * 0.06 - rank * 0.04, 0.2, 0.98),
        fin: clamp(0.5 + gauss(R) * 0.18 + (group === 'FWD' ? 0.15 : 0), 0, 1),
        dri: clamp(0.4 + gauss(R) * 0.18 + (group === 'FWD' ? 0.15 : group === 'MID' ? 0.05 : -0.1), 0, 1),
      };
      players[p.id] = p;
      sq.push(p);
    };
    FORMATIONS[t.form].forEach((s) => mk(ROLE_GROUP[s[0]], s[0], 0));
    mk('GK', 'GK', 1);
    ['DEF', 'DEF', 'DEF', 'MID', 'MID', 'MID', 'FWD', 'FWD', 'MID'].forEach((g, i) => mk(g, null, i < 6 ? 1 : 2));
    squads[t.id] = sq;
  }

  // Double round robin (circle method); play the first 12 rounds to date.
  const ids = DEMO_TEAMS.map((t) => t.id);
  const n = ids.length;
  const rounds = [];
  const arr = ids.slice();
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      pairs.push(r % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop());
  }
  const all = rounds.concat(rounds.map((rd) => rd.map(([a, b]) => [b, a])));
  const ROUNDS_PLAYED = 12;
  const start = Date.UTC(2026, 7, 1); // Sat 1 Aug 2026
  const matches = [];
  for (let r = 0; r < ROUNDS_PLAYED; r++) {
    const date = new Date(start + r * 7 * 864e5).toISOString().slice(0, 10);
    all[r].forEach(([h, a], k) => {
      const ht = DEMO_TEAMS.find((t) => t.id === h), at = DEMO_TEAMS.find((t) => t.id === a);
      matches.push(simMatch('m' + (r + 1) + '-' + k, r + 1, date, ht, at, players, squads, R));
    });
  }
  return { source: 'demo', label: 'Demo season 2026/27 (synthetic)', teams, players, matches };
}

function simMatch(mid, round, date, H, A, players, squads, R) {
  const events = [], poss = [];
  let t = 0, per = 1, eid = 0;

  function lineup(team, form) {
    const avail = squads[team.id].filter(() => R() > 0.07).sort((a, b) => a.rank - b.rank || b.q - a.q);
    const by = { GK: [], DEF: [], MID: [], FWD: [] };
    avail.forEach((p) => by[p.group].push(p));
    const slots = FORMATIONS[form].map(([role, x, y]) => {
      const g = ROLE_GROUP[role];
      let list = by[g];
      if (!list.length) list = by.MID.length ? by.MID : by.DEF.length ? by.DEF : by.FWD;
      let i = list.findIndex((p) => p.role === role);
      if (i < 0 || R() < 0.08) { const j = list.findIndex((p) => p.rank > 0); i = j >= 0 && (i < 0 || R() < 0.5) ? j : Math.max(i, 0); }
      const p = list.splice(i, 1)[0];
      return { role, x, y, group: g, pid: p.id };
    });
    const bench = [].concat(by.GK, by.DEF, by.MID, by.FWD);
    const subs = [];
    const outfield = slots.map((s, i) => i).filter((i) => i > 0);
    const nsubs = 2 + Math.floor(R() * 3);
    for (let k = 0; k < nsubs && bench.length; k++) {
      const pool = outfield.filter((i) => !subs.some((s) => s.slot === i));
      const w = pool.map((i) => (slots[i].group === 'FWD' ? 3 : slots[i].group === 'MID' ? 2 : 1));
      let u = R() * w.reduce((a, b) => a + b, 0), slot = pool[0];
      for (let j = 0; j < pool.length; j++) { u -= w[j]; if (u <= 0) { slot = pool[j]; break; } }
      let bi = bench.findIndex((p) => p.group === slots[slot].group);
      if (bi < 0) bi = bench.findIndex((p) => p.group !== 'GK');
      if (bi < 0) break;
      const on = bench.splice(bi, 1)[0];
      subs.push({ t: 3300 + Math.round(R() * 1700), slot, on: on.id });
    }
    subs.sort((a, b) => a.t - b.t);
    return { slots, subs };
  }

  const sides = [H, A].map((tm, i) => {
    const form = tm.alt && R() < 0.22 ? tm.alt : tm.form;
    const lu = lineup(tm, form);
    return { i, tm, form, slots: lu.slots, subs: lu.subs, subsDone: [], q: tm.q + (i === 0 ? 0.03 : 0) + gauss(R) * 0.03, start: lu.slots.map((s) => ({ ...s })) };
  });
  const P = (s, slot) => players[s.slots[slot].pid];

  function applySubs() {
    for (const s of sides) {
      while (s.subs.length && per === 2 && t >= s.subs[0].t) {
        const sb = s.subs.shift();
        s.subsDone.push({ min: Math.floor(sb.t / 60), off: s.slots[sb.slot].pid, on: sb.on });
        s.slots[sb.slot].pid = sb.on;
      }
    }
  }

  function actor(s, x, y, exclude, defensive) {
    let tot = 0;
    const w = s.slots.map((p, k) => {
      if (k === exclude) return 0;
      let px, py;
      if (p.role === 'GK') { px = defensive ? 3 : 6 + Math.max(0, x - 60) * 0.05; py = 40; }
      else if (defensive) { px = p.x * 0.78 + (x - 45) * 0.32; py = p.y + (y - 40) * 0.25; }
      else { px = p.x + (x - 60) * 0.3; py = p.y + (y - 40) * 0.18; }
      const dx = x - px, dy = y - py;
      let wk = Math.exp(-((dx * dx) / 450 + (dy * dy) / 338)) + 1e-6;
      if (p.role === 'GK') wk *= defensive ? (x < 18 && Math.abs(y - 40) < 20 ? 2.5 : 0.01) : x < 30 ? 1.2 : 0.005;
      tot += wk;
      return wk;
    });
    let u = R() * tot;
    for (let k = 0; k < w.length; k++) { u -= w[k]; if (u <= 0) return k; }
    return exclude === 10 ? 9 : 10;
  }

  let cur, S;
  function startPoss(s, type, x, y, slot) {
    cur = { i: poss.length, team: s.tm.id, startT: Math.round(t), per, startType: type, startX: x };
    poss.push(cur);
    S = { s, slot: slot == null ? actor(s, x, y, -1, false) : slot, x, y, lastPass: null, head: false, sp: null };
  }
  function E(s, slot, type, x, y, o) {
    const e = { id: mid + ':' + eid++, per, t: Math.round(t), team: s.tm.id, pl: s.slots[slot].pid, type, x: +x.toFixed(1), y: +y.toFixed(1), pos: cur.i };
    if (o) for (const k in o) if (o[k] !== undefined) e[k] = typeof o[k] === 'number' && k !== 'xg' && k !== 'xa' ? +o[k].toFixed(1) : o[k];
    events.push(e);
    return e;
  }
  const opp = (s) => sides[1 - s.i];

  function kickoff(s) {
    const st = s.slots.findIndex((p) => p.group === 'FWD');
    startPoss(s, 'kickoff', 60, 40, st >= 0 ? st : 10);
  }
  function goalKick(s) { startPoss(s, 'gk', 6, 40, 0); }

  function shoot(opts = {}) {
    const s = S.s, o = opp(s), p = P(s, S.slot);
    let x = S.x, y = S.y, xg;
    if (opts.pen) { x = 108; y = 40; xg = 0.78; }
    else if (opts.fk) xg = clamp(xgOf(x, y) * 0.55, 0.03, 0.12);
    else xg = xgOf(x, y, opts.head);
    const g = R() < xg * (0.74 + 0.34 * p.fin) * (1.06 - o.q * 0.12);
    let out = 'goal';
    if (!g) { const r = R(); out = r < 0.4 ? 'saved' : r < 0.66 ? 'blocked' : 'off'; }
    const sp = opts.pen ? 'pen' : opts.fk ? 'fk' : S.sp || undefined;
    E(s, S.slot, 'shot', x, y, { xg: +xg.toFixed(3), out, head: opts.head || undefined, sp });
    const lp = S.lastPass;
    if (lp && lp.rc === p.id && !opts.pen && !opts.fk) { lp.key = true; lp.xa = +xg.toFixed(3); if (g) lp.ast = true; }
    t += 2;
    if (out === 'goal') { t += 50 + R() * 30; kickoff(o); }
    else if ((out === 'saved' || out === 'blocked') && R() < 0.42) { t += 22 + R() * 12; corner(s); }
    else if (out === 'saved') { t += 6 + R() * 6; goalKick(o); }
    else { t += 20 + R() * 12; goalKick(o); }
  }

  function corner(s) {
    const cy = R() < 0.5 ? 0.5 : 79.5;
    startPoss(s, 'setpiece', 119.5, cy);
    S.slot = actor(s, 100, cy < 40 ? 15 : 65, 0, false);
    S.sp = 'corner';
    pass({ corner: true });
  }

  function foulOrTackle(o, s, x, y) {
    // o tackles s at (x,y) in s frame
    const ox = PL - x, oy = PW - y;
    const d = actor(o, ox, oy, -1, true);
    if (R() < 0.15) {
      E(o, d, 'foul', ox, oy);
      t += 14 + R() * 16;
      if (x > 102 && Math.abs(y - 40) < 20 && R() < 0.7) {
        startPoss(s, 'setpiece', 108, 40);
        let best = 1, bf = -1;
        s.slots.forEach((sl, k) => { if (k && players[sl.pid].fin > bf) { bf = players[sl.pid].fin; best = k; } });
        S.slot = best;
        shoot({ pen: true });
        return;
      }
      startPoss(s, 'setpiece', x, y, S.slot);
      S.sp = 'fk';
      if (x > 90 && Math.abs(y - 40) < 18 && R() < 0.35) shoot({ fk: true });
      return;
    }
    startPoss(o, 'recovery', ox, oy, d);
    E(o, d, 'tackle', ox, oy, { ok: true });
    t += 1;
  }

  function pass(opts = {}) {
    const s = S.s, o = opp(s), p = P(s, S.slot), tm = s.tm;
    const x = S.x, y = S.y, dq = s.q - o.q;
    let tx, ty, cross = false;
    const long = !opts.corner && R() < (x < 50 ? tm.dir * 0.3 : tm.dir * 0.07);
    if (opts.corner) { tx = 106 + R() * 9; ty = 40 + gauss(R) * 8; cross = true; }
    else if (x > 84 && (y < 20 || y > 60) && R() < 0.38 + tm.width * 0.1) { cross = true; tx = 104 + R() * 12; ty = 40 + gauss(R) * 9; }
    else if (long) { tx = x + 26 + R() * 28; ty = 40 + gauss(R) * 22; }
    else {
      tx = x + 5 + tm.dir * 6 + gauss(R) * 11 - (x > 96 ? 8 : 0);
      ty = y + gauss(R) * 13 + (40 - y) * 0.08 + (tm.width - 0.5) * (y > 40 ? 6 : -6);
    }
    tx = clamp(tx, 1, 119);
    if (ty < 1.5) ty = clamp(3 - ty + R() * 4, 1.5, 30); else if (ty > 78.5) ty = clamp(157 - ty - R() * 4, 50, 78.5); // bounce targets off the touchline
    const len = Math.hypot(tx - x, ty - y);
    const intoBox = tx > 102 && Math.abs(ty - 40) < 20;
    let pk = 0.87 + p.q * 0.08 + dq * 0.12 - len * 0.003 - (intoBox ? 0.2 : 0) - (tx > 80 ? 0.04 : 0) - (x < 45 ? o.tm.press * 0.07 : 0) + (tx < x ? 0.06 : 0) - (cross ? 0.3 : 0) + (opts.corner ? 0.08 : 0);
    const ok = R() < clamp(pk, 0.1, 0.97);
    const e = E(s, S.slot, 'pass', x, y, { ex: tx, ey: ty, ok, cross: cross || undefined, sp: opts.corner ? 'corner' : S.sp && len < 60 ? S.sp : undefined });
    S.sp = opts.corner ? 'corner' : null;
    t += 1.5 + len * 0.05 + R() * 1.5;
    const rc = actor(s, tx, ty, S.slot, false);
    const ox = PL - tx, oy = PW - ty;
    if (len > 32 && !cross && R() < 0.65) {
      const d = actor(o, ox, oy, -1, true);
      E(s, rc, 'duel', tx, ty, { ok });
      E(o, d, 'duel', ox, oy, { ok: !ok });
    }
    if (ok) {
      e.rc = s.slots[rc].pid;
      S.lastPass = e; S.slot = rc; S.x = tx; S.y = ty;
      if (cross && intoBox && R() < (opts.corner ? 0.55 : 0.45)) S.head = true;
      return;
    }
    if (ty < 2 || ty > 78 || R() < 0.16) {
      t += 9 + R() * 12;
      startPoss(o, 'throw', ox, oy > 40 ? 79.5 : 0.5);
      return;
    }
    if (cross) {
      const d = actor(o, ox, oy, -1, true);
      startPoss(o, 'recovery', ox, oy, d);
      E(o, d, 'clearance', ox, oy);
      t += 2.5;
      const lx = clamp(ox + 18 + R() * 18, 1, 119), ly = clamp(oy + gauss(R) * 14, 1, 79);
      if (R() < 0.55) { const k = actor(o, lx, ly, -1, false); S.slot = k; S.x = lx; S.y = ly; E(o, k, 'recovery', lx, ly); }
      else { startPoss(s, 'recovery', PL - lx, PW - ly); E(s, S.slot, 'recovery', PL - lx, PW - ly); }
      return;
    }
    const f = 0.45 + R() * 0.55;
    const ix = PL - (x + (tx - x) * f), iy = PW - (y + (ty - y) * f);
    const d = actor(o, ix, iy, -1, true);
    startPoss(o, 'recovery', ix, iy, d);
    if (R() < 0.3) E(o, d, 'interception', ix, iy, { ok: true });
    else E(o, d, 'recovery', ix, iy);
  }

  function carry() {
    const s = S.s, o = opp(s), x = S.x, y = S.y, dq = s.q - o.q;
    const dx = (3 + R() * 8) * (x > 100 ? 0.4 : 1), dy = gauss(R) * 4;
    const ex = clamp(x + dx, 1, 119), ey = clamp(y + dy, 1, 79);
    const lost = 0.05 + (x < 45 ? o.tm.press * 0.05 : 0) + (x > 80 ? 0.04 : 0) - dq * 0.04;
    if (R() < lost) {
      const mx = (x + ex) / 2, my = (y + ey) / 2;
      E(s, S.slot, 'carry', x, y, { ex: mx, ey: my });
      t += 2;
      S.x = mx; S.y = my;
      foulOrTackle(o, s, mx, my);
      return;
    }
    E(s, S.slot, 'carry', x, y, { ex, ey });
    S.x = ex; S.y = ey;
    t += 1.5 + dx * 0.15 + R() * 1.5;
  }

  function dribble() {
    const s = S.s, o = opp(s), p = P(s, S.slot), x = S.x, y = S.y;
    const ok = R() < 0.46 + p.dri * 0.2 + (s.q - o.q) * 0.2;
    E(s, S.slot, 'dribble', x, y, { ok });
    t += 2.5;
    if (ok) { S.x = clamp(x + 4 + R() * 6, 1, 119); S.y = clamp(y + gauss(R) * 5, 1, 79); }
    else foulOrTackle(o, s, x, y);
  }

  function step() {
    applySubs();
    const s = S.s, p = P(s, S.slot), x = S.x, y = S.y, dq = s.q - opp(s).q;
    if (S.head) { S.head = false; shoot({ head: true }); return; }
    const inBox = x > 102 && Math.abs(y - 40) < 20, edge = x > 86 && Math.abs(y - 40) < 24;
    const ps = (inBox ? 0.085 : edge ? 0.024 : 0) * (1 + dq * 0.3);
    if (ps && R() < ps) { shoot(); return; }
    const r = R();
    if (r < 0.7 || (x < 30 && r < 0.86)) pass();
    else if (x > 55 && R() < 0.22 + p.dri * 0.25) dribble();
    else carry();

  for (per = 1; per <= 2; per++) {

/* ---------- Pass network ---------- */
function passNetwork(matches, T, color) {

  matches.forEach((m) => Object.entries(m.minutes).forEach(([pid, mn]) => { if (DB.players[pid] && DB.players[pid].team === T) mins[pid] = (mins[pid] || 0) + mn / 1000; }));
  const ids = Object.keys(mins).sort((a, b) => mins[b] - mins[a]).slice(0, 11);
  const set = new Set(ids);

  ids.forEach((id) => { pos[id] = [0, 0, 0]; cnt[id] = 0; });
  matches.forEach((m) => m.events.forEach((e) => {
    if (e.team !== T) return;
    if (set.has(e.pl) && (e.type === 'pass' || e.type === 'carry' || e.type === 'dribble' || e.type === 'shot')) { const q = pos[e.pl]; q[0] += e.x; q[1] += e.y; q[2]++; }
    if (e.type === 'pass' && e.ok && e.rc && set.has(e.rc)) {
      const q = pos[e.rc]; q[0] += e.ex; q[1] += e.ey; q[2]++;
      if (set.has(e.pl)) { cnt[e.pl]++; const k = e.pl < e.rc ? e.pl + '|' + e.rc : e.rc + '|' + e.pl; links[k] = (links[k] || 0) + 1; }
    }

    const [a, b] = k.split('|');

    p.marks.append(ln);
  });
  const maxC = Math.max(1, ...Object.values(cnt));
  const surf = css('--surface');
  ids.forEach((id) => {
    const q = pos[id];

    const x = q[0] / q[2], y = q[1] / q[2], pl = DB.players[id];
    const r = 2.2 + 2.2 * Math.sqrt(cnt[id] / maxC);
    const g = sv('g', { tabindex: 0 });
    g.append(sv('circle', { cx: x, cy: y, r, fill: color, stroke: surf, 'stroke-width': 0.5 }));
    g.append(sv('text', { x, y: y + 1.05, 'text-anchor': 'middle', 'font-size': 2.9, 'font-weight': 700, fill: '#fff', style: 'font-family: var(--font-display)', text: pl.num != null ? pl.num : pl.name.split(' ').pop().slice(0, 3) }));
    g.append(sv('text', { x, y: y + r + 2.8, 'text-anchor': 'middle', 'font-size': 2.3, fill: css('--ink-2'), text: pl.name.split(' ').pop() }));
    hover(g, () => [{ v: pl.name, strong: true }, { v: (cnt[id] / n).toFixed(1) + ' passes/match to this XI' }, { v: GROUP_NAME[pl.group] }]);
    p.marks.append(g);
  });

/* ---------- Charts ---------- */

  const Y = (v) => m.t + (H - m.t - m.b) * (1 - v / top);

    const d = s.values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');

    s.values.forEach((v, i) => svg.append(sv('circle', { cx: X(i), cy: Y(v), r: i === n - 1 ? 4 : 2.6, fill: s.color, stroke: css('--surface'), 'stroke-width': 1.5 })));
  });

  svg.append(cross);

    const r = svg.getBoundingClientRect();

    const i = clamp(Math.round(((px - m.l) / (W - m.l - m.r)) * (n - 1)), 0, n - 1);

}

/* =====================================================================
   Saved imports
   Keeps the files and FBref tables you import in this browser's own
   storage (IndexedDB), and replays them when the app opens. Nothing is
   uploaded. Storage can be unavailable (private windows, blocked site
   data): every call fails soft and the app works without it.
   ===================================================================== */

const STORE = { db: null, ok: null, meta: null };

function storeOpen() {
  if (STORE.db || STORE.ok === false) return Promise.resolve(STORE.db);
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('touchline-lab', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => { STORE.db = req.result; STORE.ok = true; resolve(STORE.db); };
      req.onerror = req.onblocked = () => { STORE.ok = false; resolve(null); };
    } catch (e) { STORE.ok = false; resolve(null); }
  });
}
async function storeGet(key) {
  const db = await storeOpen();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const r = db.transaction('kv').objectStore('kv').get(key);
      r.onsuccess = () => resolve(r.result == null ? null : r.result);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function storeSet(key, value) {
  const db = await storeOpen();
  if (!db) return false;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction('kv', 'readwrite');
      if (value == null) tx.objectStore('kv').delete(key); else tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => resolve(false); // e.g. storage quota full
    } catch (e) { resolve(false); }
  });
}

/* The saved log: the season files last imported, then each FBref table added to it, in order. */
function savedSummary(log) {
  if (!log) return null;
  const fb = log.fbref || [];
  const teams = [...new Set(fb.map((f) => f.teamName))];
  return { files: log.primary.map((f) => f.name), label: log.label || '', fbTables: fb.reduce((s, f) => s + f.texts.length, 0), fbTeams: teams, savedAt: log.savedAt };
}
// FBref tables saved on top of the same season (same label), so an updated season file keeps them
async function carriedFbref(label) {
  const prev = await storeGet('log');
  return prev && prev.label === label ? prev.fbref || [] : [];
}
async function savePrimary(texts, label, fbref) {
  const log = { v: 1, savedAt: Date.now(), label, primary: texts.map((t) => ({ name: t.name, text: t.text })), fbref: fbref || [] };
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : null;
  return ok;
}
async function saveFbref(teamId, teamNameText, texts) {
  let log = await storeGet('log');
  // On top of the built-in snapshot: save the snapshot as the base, so the new table survives a reload
  if (!log && DB.snapshot && SNAP) log = { v: 1, savedAt: Date.now(), label: DB.label, primary: SNAP.primary, fbref: snapshotFbref(DB) };
  if (!log) return false; // FBref tables only make sense on top of a saved season
  texts.forEach((t) => {
    if (log.fbref.some((f) => f.team === teamId && f.texts.some((x) => x.text === t.text))) return; // same table pasted again
    log.fbref.push({ team: teamId, teamName: teamNameText, texts: [{ name: t.name, text: t.text }] });
  });
  log.savedAt = Date.now();
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : STORE.meta;
  return ok;
}
async function forgetSaved() {
  await storeSet('log', null);
  STORE.meta = null;
}

/* Built-in snapshot of real data (present only in builds made with --with-snapshot). */
const SNAP = typeof SNAPSHOT !== 'undefined' ? SNAPSHOT : null;
function snapshotFbref(db) {
  if (!SNAP) return [];
  return SNAP.fbref.map((f) => { const t = db.teams.find((x) => x.name === f.team); return t ? { team: t.id, teamName: t.name, texts: f.texts } : null; }).filter(Boolean);
}
function loadSnapshot() {
  if (!SNAP) return false;
  if (!importTexts(SNAP.primary, null, { restore: true })) return false;
  snapshotFbref(DB).forEach((f) => addFbref(f.texts, f.team, null, { restore: true }));
  DB.snapshot = SNAP.asOf;
  return true;
}
// Back to real data: the viewer's saved imports if any, else the built-in snapshot
async function loadRealData() {
  const r = STORE.meta ? await restoreSaved() : null;
  if (r && r.ok) return true;
  return loadSnapshot();
}

/* On open: rebuild the last session from the saved log. Returns a message, or null if nothing was saved. */
async function restoreSaved() {
  const log = await storeGet('log');
  if (!log || !log.primary || !log.primary.length) return null;
  try {
    const ok = importTexts(log.primary, null, { restore: true });
    if (!ok) return { error: 'Your saved data could not be loaded again, so the demo season is showing. Import your files again in the Data tab.' };
    (log.fbref || []).forEach((f) => { if (DB.teamById[f.team]) addFbref(f.texts, f.team, null, { restore: true }); });
    STORE.meta = savedSummary(log);
    return { ok: true };
  } catch (e) {
    return { error: 'Your saved data could not be loaded again (' + e.message + '), so the demo season is showing.' };
  }
}
