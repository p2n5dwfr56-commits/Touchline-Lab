<title>Touchline Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: analyst workbench. Sticky app bar + filter row, then a responsive card grid.
   Pitch diagrams are the hero material; type is condensed sports display over a plain humanist body. */
:root {
  --bg: #f1f3f0;
  --surface: #fbfcfa;
  --surface-2: #e9ede8;
  --ink: #111713;
  --ink-2: #485350;
  --muted: #747e78;
  --rule: #dce1db;
  --rule-2: #c3cbc4;
  --pitch: #e6ece5;
  --pitch-line: #a9b6ac;
  --accent: #b3121c;
  --accent-ink: #ffffff;
  --team-a: #e34948;
  --team-b: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b; --good-text: #006300; --bad-text: #b02a2a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d110f; --surface: #151a17; --surface-2: #1d2420; --ink: #edf1ed; --ink-2: #b6bfb8; --muted: #86908a;
    --rule: #252d28; --rule-2: #36413a; --pitch: #18211c; --pitch-line: #3e4d44; --accent: #ef5350; --accent-ink: #0d110f;
    --team-a: #e66767; --team-b: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
    --good-text: #3fbf3f; --bad-text: #f07575;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d110f; --surface: #151a17; --surface-2: #1d2420; --ink: #edf1ed; --ink-2: #b6bfb8; --muted: #86908a;
  --rule: #252d28; --rule-2: #36413a; --pitch: #18211c; --pitch-line: #3e4d44; --accent: #ef5350; --accent-ink: #0d110f;
  --team-a: #e66767; --team-b: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
  --good-text: #3fbf3f; --bad-text: #f07575;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .tnum { font-variant-numeric: tabular-nums; }

/* ---------- App bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }
.brand svg { width: 30px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule-2); font-size: 12px; color: var(--ink-2); white-space: nowrap; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip .dot { flex: none; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.chip.real .dot { background: var(--good); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field label, .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
select { background: var(--surface); border: 1px solid var(--rule-2); border-radius: 4px; padding: 5px 28px 5px 9px; max-width: 100%; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; padding: 5px 11px; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.tabs { display: flex; flex-direction: column; gap: 0; } /* labelled rows of tabs rather than a scrolling strip */
.tab-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; border-top: 1px solid var(--rule); }
.tab-row:first-child { border-top: 0; }
.tab-label { width: 120px; flex: none; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tabs button { background: none; border: 0; padding: 7px 10px 8px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

/* ---------- Content ---------- */
main { padding-block: 20px 60px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); align-items: start; }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card.span, .grid > .span { grid-column: 1 / -1; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-h h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.card-h p, .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; max-width: 70ch; }

.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; margin-bottom: 16px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-size: clamp(38px, 7vw, 64px); font-weight: 700; line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; }
.hero .meta { color: var(--ink-2); font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.form { display: inline-flex; gap: 4px; }
.form span { width: 22px; height: 22px; border-radius: 3px; display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: #fff; }
.form .W { background: var(--good); } .form .D { background: var(--muted); } .form .L { background: var(--bad); }

.kpis { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.kpi { background: var(--surface); padding: 12px 14px; }
.kpi .v { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; margin-top: 4px; }
.kpi .v small { font-size: 16px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.kpi .r { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kpi .r b { color: var(--ink-2); font-weight: 600; }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 6px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
th.sortable { cursor: pointer; user-select: none; }
th.sorted { color: var(--ink); }
th.sorted::after { content: " ▾"; }
th.l, td.l { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tr.focus td { background: color-mix(in srgb, var(--team-a) 12%, var(--surface)); font-weight: 600; }
tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--team-a); }
td .pos { color: var(--muted); font-size: 12px; margin-left: 6px; }
.badge { display: inline-block; min-width: 34px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; padding: 1px 5px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); margin-right: 8px; }

/* ---------- Tactics ---------- */
.board { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(240px, 1fr); gap: 20px; align-items: start; }
.xi { display: flex; flex-direction: column; gap: 10px; }
.xi-unit { display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.xi-unit:last-of-type { border-bottom: 0; }
.xi-row { display: flex; align-items: baseline; gap: 2px; font-size: 13.5px; }
.xi-row .badge { flex: none; }
.xi-name { display: flex; flex-direction: column; min-width: 0; }
.xi-name a { color: var(--ink); font-weight: 600; text-decoration: none; }
.xi-name a:hover { text-decoration: underline; }
.xi-name small { color: var(--muted); font-size: 12px; }
.subs { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
@media (max-width: 820px) { .board { grid-template-columns: 1fr; } }

/* ---------- Opponents ---------- */
.wdl { display: flex; gap: 1px; width: 110px; height: 12px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.wdl.wide { width: 100%; height: 16px; margin-top: 4px; }
.wdl div { min-width: 0; }
.wdl .W { background: var(--good); } .wdl .D { background: var(--muted); } .wdl .L { background: var(--bad); }
.opp-table th.grp { text-align: center; border-bottom: 1px solid var(--rule-2); color: var(--ink-2); }

/* ---------- Add a match ---------- */
.am-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.am-form input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-2); border-radius: 4px; padding: 5px 9px; width: 100%; min-width: 0; }
.am-score { display: grid; grid-template-columns: auto minmax(60px, 90px) auto minmax(60px, 90px); gap: 6px 10px; align-items: end; margin-top: 12px; max-width: 420px; }
.am-score > span:not(.eyebrow) { padding-bottom: 7px; color: var(--muted); }
.am-score .eyebrow { padding-bottom: 8px; }
.cup-next { padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius); }
.cup-next-line { font-size: 16px; margin-top: 2px; }

/* ---------- Match timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 13.5px; }
.timeline li { display: grid; grid-template-columns: 38px 10px 56px 1fr; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.tl-min { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; }
.tl-kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.tl-goal .tl-kind, .tl-goal .tl-text { color: var(--ink); font-weight: 700; }
.tl-red .tl-kind { color: var(--bad-text); }
.prose pre.cmd { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 8px 10px; border-radius: 4px; overflow-x: auto; white-space: pre; margin: 6px 0; }

/* ---------- Charts ---------- */
svg { display: block; }
.pitch { width: 100%; height: auto; max-width: 100%; }
.pitch.half { max-height: 520px; margin: 0 auto; }
.pitch .bg { fill: var(--pitch); }
.pitch .ln { fill: none; stroke: var(--pitch-line); stroke-width: 0.4; }
.pitch .spot { fill: var(--pitch-line); }
.pitch .dir { fill: var(--muted); font-size: 2.6px; font-family: var(--font-body); }
.axis text, .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.axis line, .grid-line { stroke: var(--rule); stroke-width: 1; }
.baseline { stroke: var(--rule-2); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 16px; }
.legend i.ring { border-radius: 50%; border: 2px solid currentColor; background: transparent; }
.twin { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.twin h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.statline { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.statline div { display: flex; flex-direction: column; }
.statline b { font-family: var(--font-display); font-size: 24px; line-height: 1; }
.statline span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.stackbar { display: flex; gap: 2px; height: 30px; border-radius: 4px; overflow: hidden; }
.stackbar div { display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; }
.stackbar div.dk { color: #0b0b0b; }
.phase-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.phase-row .eyebrow { line-height: 1.2; }

.hbars { display: flex; flex-direction: column; gap: 7px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 86px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .track { position: relative; height: 16px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; }
.hbar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; }
.hbar .val small { color: var(--muted); }

.fly { display: flex; flex-direction: column; gap: 4px; }
.fly-row { display: grid; grid-template-columns: 1fr minmax(110px, 160px) 1fr; gap: 8px; align-items: center; font-size: 13px; }
.fly-row .lab { text-align: center; color: var(--ink-2); font-size: 12.5px; line-height: 1.2; }
.fly-side { display: flex; align-items: center; gap: 6px; }
.fly-side.l { flex-direction: row-reverse; }
.fly-side .trk { flex: 1; display: flex; min-width: 0; }
.fly-side.l .trk { justify-content: flex-end; }
.fly-side .b { height: 14px; border-radius: 3px; min-width: 2px; }
.fly-side.l .b { border-radius: 3px 0 0 3px; }
.fly-side.r .b { border-radius: 0 3px 3px 0; }
.fly-side .v { font-variant-numeric: tabular-nums; min-width: 42px; }
.fly-side.l .v { text-align: right; }
.fly-side .v.win { font-weight: 700; }
.fly-head { display: grid; grid-template-columns: 1fr minmax(110px, 160px) 1fr; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.fly-head div:first-child { text-align: right; }

.pct { display: flex; flex-direction: column; gap: 6px; }
.pct-row { display: grid; grid-template-columns: minmax(120px, 42%) 1fr; gap: 10px; align-items: center; font-size: 13px; }
.pct-bars { display: flex; flex-direction: column; gap: 3px; }
.pct-bar { display: grid; grid-template-columns: 1fr 78px; gap: 8px; align-items: center; }
.pct-bar .trk { position: relative; height: 13px; background: var(--surface-2); border-radius: 0 3px 3px 0; }
.pct-bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 3px 3px 0; }
.pct-bar .t { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pct-row .nm small { color: var(--muted); display: block; font-size: 11.5px; }

.funnel { display: flex; flex-direction: column; gap: 6px; }

.mlist { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 74px 30px 1fr auto 74px; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--rule); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; font-size: 13.5px; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-current="true"] { background: color-mix(in srgb, var(--team-a) 12%, var(--surface)); box-shadow: inset 3px 0 0 var(--team-a); }
.mrow .score { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.mrow .xg { color: var(--muted); font-size: 12px; text-align: right; }
.mrow .d { color: var(--muted); font-size: 12px; }
.res { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 13px; }
.res.W { background: var(--good); } .res.D { background: var(--muted); } .res.L { background: var(--bad); }

.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; margin-bottom: 4px; }
.scoreboard .tn { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 3.5vw, 30px); text-transform: uppercase; line-height: 1; }
.scoreboard .tn.r { text-align: right; }
.scoreboard .sc { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 6vw, 56px); line-height: 1; }
.scoreboard .xgs { font-size: 13px; color: var(--muted); margin-top: 4px; }

.profile-h { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; margin-bottom: 12px; }
.profile-h h2 { margin: 0; font-family: var(--font-display); font-size: 30px; text-transform: uppercase; line-height: 1; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

.btn { background: var(--ink); color: var(--bg); border: 0; padding: 8px 14px; border-radius: 4px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule-2); }
.drop { border: 2px dashed var(--rule-2); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--surface-2); }
.prose { max-width: 72ch; }
.prose p, .prose li { color: var(--ink-2); }
.prose h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 17px; margin: 18px 0 6px; }
.prose code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.prose a { color: var(--c1); text-underline-offset: 2px; overflow-wrap: anywhere; }
.saved { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.saved .sub { margin-top: 2px; }
textarea { width: 100%; font-family: var(--font-mono); font-size: 12px; line-height: 1.4; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 4px; padding: 8px; resize: vertical; white-space: pre; }
.status { margin-top: 10px; font-size: 13.5px; }
.status.err { color: var(--bad-text); }
.status.ok { color: var(--good-text); }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 4px; font-size: 12.5px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
.tip .tv { font-weight: 700; font-size: 14px; }
.tip .tl { opacity: 0.75; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

@media (max-width: 640px) {
  .filters { margin-left: 0; width: 100%; }
  .filters .field { flex: 1 1 140px; }
  .filters select { width: 100%; }
  .mrow { grid-template-columns: 62px 26px 1fr auto; }
  .mrow .xg { display: none; }
  .hbar { grid-template-columns: 1fr 1fr 56px; }
  .phase-row { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill, .fly-side .b, .pct-bar .fill { transition: width 0.35s ease; }
}

/* Key players */
.mvp-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 16px; }

/* =====================================================================

/* ---------- Demo league (synthetic style profiles, not real ratings) ---------- */
const DEMO_TEAMS = [
  { id: 'ABE', name: 'Aberdeen', q: 0.62, dir: 0.45, press: 0.56, width: 0.62, form: '4-2-3-1', alt: '3-4-2-1' },
  { id: 'CEL', name: 'Celtic', q: 0.9, dir: 0.16, press: 0.82, width: 0.7, form: '4-3-3' },

  const R = mulberry32(seed);
  const teams = DEMO_TEAMS.map((t) => ({ id: t.id, name: t.name, style: t }));
  const players = {};
  const squads = {};
  const used = new Set();
  let pid = 0;

    const mk = (group, role, rank) => {

  for (let r = 0; r < n - 1; r++) {

    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      pairs.push(r % 2 === 0 ? [a, b] : [b, a]);

      const g = ROLE_GROUP[role];

function boot() {

  mainEl.append(loading);
  setTimeout(async () => {
    DEMO = DB = prepareDB(buildDemo());
    const hash = (location.hash || '').slice(1);
    if (TABS.some(([k]) => k === hash)) S.tab = hash;
    // Bring back the last imported season (and FBref tables) saved in this browser
    loading.textContent = 'Loading your saved data…';
    const restored = await restoreSaved();
    if (!(restored && restored.ok)) loadSnapshot(); // no saved imports: open on the built-in real data, if this build has it
    await refreshSeasons();
    await restoreAttendance();
    await restoreClubHistory();
    await restoreFinance();
    await restoreManagers();
    render();
    if (restored && restored.error) flash(restored.error, 'err');
    else if (restored && STORE.meta) flash(`Restored your saved data: ${STORE.meta.label || STORE.meta.files.join(', ')}${STORE.meta.fbTables ? ` + ${STORE.meta.fbTables} FBref table${STORE.meta.fbTables > 1 ? 's' : ''}` : ''}. Manage it in the Data tab.`);
  }, 20);
  let rt, lastW = window.innerWidth;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (DB && Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; const y = window.scrollY; render(); window.scrollTo(0, y); } }, 250); });
  const rerender = () => DB && render();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch (e) {}

  // Rows of outfield players, back to front, as slot indexes into an 11-player line-up (GK = 0).
  const parts = String(form || '').split('-').map(Number).filter((x) => x > 0);
  if (parts.reduce((s, x) => s + x, 0) !== n - 1) return null;

}

  const f = FORMATIONS[form];
  if (f && f[idx] && f[idx][0] === role) return [f[idx][1], f[idx][2]];
  return ROLE_POS[role] || [60, 40];

    if (e.team !== T || !e.pl) return;

    else if (e.type in DEF_TYPES || e.type === 'duel') add(e.pl, 'out', e.x, e.y);

}

/* Choose the XI and formation to show on the board. */

      trophies: seasons.reduce((t, x) => t + x.trophies, 0), bestEu: bestEu.eu.stage ? `${bestEu.eu.comp ? bestEu.eu.comp + ' ' : ''}${EURO_STAGE[bestEu.eu.stage]} (${bestEu.s})` : '',
      wt: (() => { const both = seasons.filter((x) => x.y.turnover && x.y.staff); return both.length ? both.reduce((t, x) => t + x.y.staff, 0) / both.reduce((t, x) => t + x.y.turnover, 0) : null; })() };

    c.label = zv[i] >= 0.3 ? (bigSpend ? 'Big spend, big return' : 'Punching above their weight') : zv[i] <= -0.3 ? (bigSpend ? 'Not getting full value' : 'Struggling for value') : bigSpend ? 'Getting what they pay for' : 'Par for the budget';

        .map((x) => ({ ...x, key: !i.sort_by ? x.a.min : String(i.sort_by) === 'rating' ? (x.a.rtN ? x.a.rt / x.a.rtN : -1) : has(x.a[String(i.sort_by)]) ? (i.per90 ? (x.a[String(i.sort_by)] * 90) / x.a.min : x.a[String(i.sort_by)]) : -1 }))
        .sort((x, y) => y.key - x.key).slice(0, Math.min(80, Math.max(1, Number(i.limit) || 40)));
      return rows.map((x) => playerRow(x.p, x.a));
    },
  },
  {
    name: 'player_matches', description: 'One player, match by match under the current filters: date, opponent, minutes and that match’s stats (rating, goals, assists, shots, key passes, passes completed, tackles, interceptions, recoveries, duels won, headers won).',
    inputSchema: { type: 'object', properties: { player: { type: 'string', description: 'Player name' } }, required: ['player'] },
    execute: (i) => {
      const p = findPlayer(i.player);
      if (!p) throw new Error('No player matching "' + i.player + '"');
      progress('Reading ' + p.name + '’s matches…');
      const ms = scoped(p.team).filter((m) => m.ps && m.ps[p.id]);
      if (!ms.length) return { player: p.name, team: teamName(p.team), note: 'No match-by-match stats for this player in this data (season totals only).', totals: playerRow(p, aggPlayer(scoped(p.team), p.id)) };
      return { player: p.name, team: teamName(p.team), matches: ms.map((m) => { const s = m.ps[p.id]; return { date: m.date, opponent: teamName(oppOf(m, p.team)), venue: venueOf(m, p.team), min: s.min, rating: s.rtN ? r2a(s.rt / s.rtN) : null, g: r2a(s.g), ast: r2a(s.ast), sh: r2a(s.sh), key: r2a(s.key), pc: r2a(s.pc), tkl: r2a(s.tkl), int: r2a(s.int), rec: r2a(s.rec), duelW: r2a(s.duelW), aerW: r2a(s.aerW) }; }) };
    },
  },
];

function askPrompt(q) {
  const metrics = TEAM_METRICS.filter((m) => leagueAggs().some((r) => has(m.f(r.a)))).map((m) => `${m.k} = ${m.l}${m.u ? ' (' + m.u + ')' : ''}`).join('; ');
  return [
    'You are the analyst inside Touchline Lab, a football stats app. Answer the user’s question with a custom table and/or chart built ONLY from numbers returned by the tools. Never invent, estimate or recall numbers from memory; if the data cannot answer the question, say so in the summary and return no table.',
    '',
    'Data on screen: ' + DB.label + (DB.season ? ' (season ' + DB.season + ')' : '') + '. It has ' + dataHas() + '.',
    'Current filters (the tools already apply them): team ' + teamName(S.team) + '; matches ' + rangeLabel() + '; venue ' + S.venue + '; competition ' + (S.comp === 'league' ? 'league only' : S.comp === 'cups' ? 'cups only' : 'all competitions') + '.',
    'Teams: ' + DB.teams.map((t) => t.name).join(', ') + '.',
    'Team metric keys for team_metric_all_teams: ' + metrics + '.',
    'Per-90 = total × 90 ÷ minutes. Round to sensible precision. When filtering players by minutes, say the threshold. For league-wide player rankings, call players with sort_by (and per90) rather than reading everyone.',
    'Only the season on screen is available; if the question needs another season, say the user should pick it with Season at the top and ask again.',
    '',
    'Reply with only one JSON object of this shape:',
    '{"title": "short title", "summary": "1-3 plain sentences answering the question", "table": {"columns": ["Player", "Min", "Ball wins /90"], "rows": [["Name", 812, 9.4]]} or null, "chart": {"type": "bar" or "line", "labels": ["..."], "series": [{"name": "...", "values": [1.2]}]} or null, "note": "optional caveat about the data, or empty"}',
    'Keep tables to 30 rows or fewer. A chart’s series values must line up with its labels. Use a line chart for match-by-match or over-time data, a bar chart for rankings.',
    '',
    'Question: ' + q,
  ].join('\n');
}

/* ---------- Rendering an answer ---------- */
function askAnswer(ans) {
  const out = h('div', { class: 'ask-answer' });
  if (ans.summary) out.append(h('p', { class: 'ask-summary', text: String(ans.summary) }));
  const ch = ans.chart;
  if (ch && Array.isArray(ch.labels) && Array.isArray(ch.series) && ch.labels.length && ch.series.length) {
    const labels = ch.labels.slice(0, 60).map(String);
    const pal = [css('--team-a'), css('--ink-2'), css('--c1'), css('--c3'), css('--c2')];
    const series = ch.series.slice(0, 5).map((s, i) => ({ name: String(s.name || 'Series ' + (i + 1)), color: pal[i], dash: i === 1 ? '5 4' : null, values: labels.map((_, k) => { const v = Number((s.values || [])[k]); return Number.isFinite(v) ? v : NaN; }) }));
    if (ch.type === 'line' && labels.length > 1) {
      const box = h('div');
      out.append(box);
      const all = series.flatMap((s) => s.values).filter(has);
      const zero = all.length && Math.min(...all) >= 0 && Math.min(...all) < 0.35 * Math.max(...all);
      setTimeout(() => lineChart(box, { labels, series, zero, yFmt: (v) => (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1)), tipFor: (k) => [{ v: labels[k], strong: true }].concat(series.map((s) => ({ color: s.color, v: fmt(s.values[k], 2), l: s.name }))) }), 0);
      out.append(legend(series.map((s) => [s.name, s.color, s.dash ? 'line line-dash' : 'line'])));
    } else {
      const max = Math.max(...series.flatMap((s) => s.values).filter(has).map(Math.abs), 1e-9);
      out.append(h('div', { class: 'ask-bars' }, labels.map((l, k) => h('div', { class: 'ask-bar' }, h('span', { class: 'ask-bar-l', text: l }),
        h('span', { class: 'ask-bar-t' }, series.map((s) => h('i', { style: { width: (has(s.values[k]) ? (100 * Math.abs(s.values[k])) / max : 0) + '%', background: s.color } }))),
        h('span', { class: 'ask-bar-v', text: series.map((s) => fmt(s.values[k], Math.abs(s.values[k]) >= 10 ? 0 : 2)).join(' · ') })))));
      if (series.length > 1) out.append(legend(series.map((s) => [s.name, s.color])));
    }
  }
  const tb = ans.table;
  if (tb && Array.isArray(tb.columns) && Array.isArray(tb.rows) && tb.rows.length) {
    const cols = tb.columns.slice(0, 12).map(String), rows = tb.rows.slice(0, 200).filter(Array.isArray);
    const csv = [cols].concat(rows).map((r) => r.map((c) => { const v = c == null ? '' : String(c); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
    const copy = h('button', { class: 'btn ghost', type: 'button', style: { padding: '3px 10px', fontSize: '12.5px' }, text: 'Copy as CSV' });
    copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(csv); copy.textContent = 'Copied'; } catch (e) { copy.textContent = 'Copy not allowed here'; } });
    out.append(h('div', { class: 'tbl-wrap', style: { marginTop: '12px' } }, h('table', null,
      h('thead', null, h('tr', null, cols.map((c, i) => h('th', { class: i === 0 ? 'l' : '', text: c })))),
      h('tbody', null, rows.map((r) => h('tr', { style: { cursor: 'default' } }, cols.map((_, i) => { const v = r[i]; return h('td', { class: i === 0 ? 'l' : '', text: v == null ? '' : typeof v === 'number' ? String(Math.round(v * 100) / 100) : String(v) }); })))))), h('div', { style: { marginTop: '8px' } }, copy));
  }
  if (ans.note) out.append(h('p', { class: 'note', text: String(ans.note) }));
  return out;
}

function viewAsk(el) {
  askInit();
  el.append(h('div', { class: 'hero' }, h('h1', { text: 'Ask AI' }), h('div', { class: 'meta' }, h('span', { text: 'Custom tables and charts from the data loaded here · ' + DB.label }))));
  const s = ASK.sample;
  const st = h('div', { class: 'status', role: 'status' });
  const ta = h('textarea', { id: 'ask-q', rows: 3, placeholder: 'e.g. Top 10 Aberdeen players by ball wins per 90', spellcheck: 'true' });
  const ask = h('button', { class: 'btn', type: 'button', text: 'Ask' });
  const stop = h('button', { class: 'btn ghost', type: 'button', text: 'Stop', hidden: true });

  const run = async () => {

    if (!q || ASK.busy) return;
    const ctl = new AbortController();
    ASK.busy = ctl;
    ask.disabled = true; stop.hidden = false; result.replaceChildren();
    st.className = 'status'; st.textContent = 'Thinking… (the first question asks your permission; answers take up to a minute)';
    const progress = (t) => { st.textContent = t; };
    const useTools = !ASK.limits || !!ASK.limits.tools;
    try {
      const opts = { signal: ctl.signal };
      if (useTools) opts.tools = ASK_TOOLS(progress); else opts.cache = false;
      const ans = await s.json(useTools ? askPrompt(q) : askPrompt(q) + askData(), opts);
      if (!ans || typeof ans !== 'object') throw { code: 'invalid_json' };
      st.textContent = '';
      ASK.history.unshift({ q, ans, at: Date.now(), on: DB.label });
      ASK.history = ASK.history.slice(0, 8);
      askSave();
      result.append(card({ title: String(ans.title || q).slice(0, 120), span: true }, q, askAnswer(ans)));
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') st.textContent = 'Stopped.';
      else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled') unavailable('Claude is not available to this page (permission declined or not enabled for this account).');
      else if (code === 'rate_limited') { st.className = 'status err'; st.textContent = 'Too many questions just now, or your Claude usage limit is reached. Try again later.'; }
      else if (code === 'invalid_json') { st.className = 'status err'; st.textContent = 'The answer came back in the wrong shape. Try asking again, or more simply.'; }
      else if (code === 'refused') { st.className = 'status err'; st.textContent = 'Claude declined that question. Try rewording it.'; }
      else if (code === 'tools_unavailable') unavailable('This Claude app can’t give the AI access to the data yet. Try the claude.ai website or an updated app.');

      if (ASK.busy === ctl) ASK.busy = null;
      if (!ta.disabled) ask.disabled = false;
      stop.hidden = true;
    }
  };
  ask.addEventListener('click', run);
  stop.addEventListener('click', () => ASK.busy && ASK.busy.abort());
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(); });
  const chips = h('div', { class: 'ask-chips' }, ASK_EXAMPLES.map((x) => h('button', { type: 'button', class: 'ask-chip', onclick: () => { ta.value = x; ta.focus(); }, text: x })));
  el.append(card({ title: 'Ask a question', span: true }, 'Claude reads the data loaded in the app through read-only tools, using the Season, Team, Competition, Venue and Matches filters at the top, and builds a table or chart from what it finds',
    h('div', { class: 'field' }, h('label', { for: 'ask-q', text: 'Your question' }), ta), chips,
    h('div', { style: { display: 'flex', gap: '8px', marginTop: '10px', flexWrap: 'wrap' } }, ask, stop), st,
    h('p', { class: 'note', text: 'Uses your own Claude account and usage; the first question asks your permission. Answers only use numbers in this app, so anything the data lacks (player xG, off-the-ball work) can’t be answered. Check anything important against the other tabs.' })));
  el.append(result);
  if (ASK.state === 'pending') unavailable('Connecting to Claude…');
  else if (ASK.state === 'none') unavailable('Ask AI needs the page opened on claude.ai or in the Claude app, signed in. It isn’t available in this view.');
  if (ASK.history.length) {
    const hist = h('div', { class: 'stack' });
    ASK.history.forEach((x) => hist.append(card({ title: String(x.ans.title || x.q).slice(0, 120), span: true }, x.q + ' · ' + new Date(x.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + (x.on !== DB.label ? ' · on ' + x.on : ''), askAnswer(x.ans))));
    el.append(h('div', { class: 'eyebrow', style: { margin: '18px 0 8px' }, text: 'Earlier answers (kept in this browser)' }), hist,
      h('button', { class: 'btn ghost', type: 'button', style: { marginTop: '10px' }, text: 'Clear earlier answers', onclick: () => { ASK.history = []; askSave(); render(); } }));
  }
}
'use strict';
/* =====================================================================
   Saved imports
   Keeps the files and FBref tables you import in this browser's own
   storage (IndexedDB), and replays them when the app opens. Nothing is
   uploaded. Storage can be unavailable (private windows, blocked site
   data): every call fails soft and the app works without it.
   ===================================================================== */

const STORE = { db: null, ok: null, meta: null };

function storeOpen() {
  if (STORE.db || STORE.ok === false) return Promise.resolve(STORE.db);
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('touchline-lab', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => { STORE.db = req.result; STORE.ok = true; resolve(STORE.db); };
      req.onerror = req.onblocked = () => { STORE.ok = false; resolve(null); };
    } catch (e) { STORE.ok = false; resolve(null); }
  });
}
async function storeGet(key) {
  const db = await storeOpen();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const r = db.transaction('kv').objectStore('kv').get(key);
      r.onsuccess = () => resolve(r.result == null ? null : r.result);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function storeSet(key, value) {
  const db = await storeOpen();
  if (!db) return false;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction('kv', 'readwrite');
      if (value == null) tx.objectStore('kv').delete(key); else tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => resolve(false); // e.g. storage quota full
    } catch (e) { resolve(false); }
  });
}

/* The saved log: the season files last imported, then each FBref table added to it, in order. */
function savedSummary(log) {
  if (!log) return null;
  const fb = log.fbref || [];
  const teams = [...new Set(fb.map((f) => f.teamName))];
  return { files: log.primary.map((f) => f.name), label: log.label || '', fbTables: fb.reduce((s, f) => s + f.texts.length, 0), fbTeams: teams, manual: (log.manual || []).length, layers: (log.layers || []).map((l) => l.name), savedAt: log.savedAt };
}
// Whole-season add-on files (Sportmonks downloads), replayed after the FBref tables
async function carriedLayers(label) {
  const prev = await storeGet('log');
  return prev && prev.label === label ? prev.layers || [] : [];
}
async function saveLayers(files) {
  const log = await baseLog();
  if (!log) return false;
  const names = new Set(files.map((f) => f.name));
  log.layers = (log.layers || []).filter((l) => !names.has(l.name)).concat(files.map((f) => ({ name: f.name, text: f.text })));
  log.savedAt = Date.now();
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : STORE.meta;
  return ok;
}
// A saved or built-in file on top of a season: Sportmonks line-ups, API-Football cups, or Wikipedia cup results
function applyLayerJSON(db, name, d) {
  if (smIsBundle(d)) attachSportmonks(db, d);
  else if (isCupsFile(d)) attachCupsFile(db, d);
  else if (afCupLeague([{ data: d }])) attachApiFootballCups(db, [{ name, data: d }]);
}
function applyLayers(layers) {
  (layers || []).forEach((l) => { try { applyLayerJSON(DB, l.name, JSON.parse(l.text)); } catch (e) { /* skip a damaged layer */ } });
}
// FBref tables and hand-entered matches saved on top of the same season (same label), so an updated season file keeps them
async function carriedFbref(label) {
  const prev = await storeGet('log');
  return prev && prev.label === label ? prev.fbref || [] : [];
}
async function carriedManual(label) {
  const prev = await storeGet('log');
  return prev && prev.label === label ? prev.manual || [] : [];
}
async function savePrimary(texts, label, fbref, manual, layers) {
  const log = { v: 1, savedAt: Date.now(), label, primary: texts.map((t) => ({ name: t.name, text: t.text })), fbref: fbref || [], manual: manual || [], layers: layers || [] };
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : null;
  return ok;
}
// The saved log, or (on top of the built-in snapshot) a new one with the snapshot as its base
async function baseLog() {
  const log = await storeGet('log');
  if (log) return log;
  const real = (typeof SEASONS !== 'undefined' && SEASONS.real) || DB; // the current season, even while a past one is on screen
  if (real.snapshot && SNAP) return { v: 1, savedAt: Date.now(), label: real.label, primary: SNAP.primary, fbref: snapshotFbref(real), layers: (SNAP.layers || []).slice(), manual: [] };
  return null;
}
async function saveFbref(teamId, teamNameText, texts) {
  const log = await baseLog();
  if (!log) return false; // FBref tables only make sense on top of a saved season
  texts.forEach((t) => {
    if (log.fbref.some((f) => f.team === teamId && f.texts.some((x) => x.text === t.text))) return; // same table pasted again
    log.fbref.push({ team: teamId, teamName: teamNameText, texts: [{ name: t.name, text: t.text }] });
  });
  log.savedAt = Date.now();
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : STORE.meta;
  return ok;
}
/* Matches entered by hand: a played cup tie (with a score) or an upcoming fixture (without one). */
function applyManual(db, e) {
  if (!db.teamById[e.team]) return false;
  if (e.gf != null && e.ga != null) addCupMatch(db, e.team, { ...e, manual: true });
  else addFixture(db, e.team, { ...e, manual: true });
  return true;
}
async function saveManual(e) {
  const log = await baseLog();
  if (!log) return false;
  log.manual = (log.manual || []).filter((x) => x.id !== e.id).concat(e);
  log.savedAt = Date.now();
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : STORE.meta;
  return ok;
}
async function removeManual(id) {
  const log = await storeGet('log');
  if (!log) return false;
  log.manual = (log.manual || []).filter((x) => x.id !== id);
  const ok = await storeSet('log', log);
  STORE.meta = ok ? savedSummary(log) : STORE.meta;
  return ok;
}
async function forgetSaved() {
  await storeSet('log', null);
  STORE.meta = null;
}

/* Built-in snapshot of real data (present only in builds made with --with-snapshot). */
const SNAP = typeof SNAPSHOT !== 'undefined' ? SNAPSHOT : null;
function snapshotFbref(db) {
  if (!SNAP) return [];
  return SNAP.fbref.map((f) => { const t = db.teams.find((x) => x.name === f.team); return t ? { team: t.id, teamName: t.name, texts: f.texts } : null; }).filter(Boolean);
}
function loadSnapshot() {
  if (!SNAP) return false;
  if (!importTexts(SNAP.primary, null, { restore: true })) return false;
  snapshotFbref(DB).forEach((f) => addFbref(f.texts, f.team, null, { restore: true }));
  applyLayers(SNAP.layers);
  cache.clear();
  DB.snapshot = SNAP.asOf;
  return true;
}
// Back to real data: the viewer's saved imports if any, else the built-in snapshot
async function loadRealData() {
  const r = STORE.meta ? await restoreSaved() : null;
  if (r && r.ok) return true;
  return loadSnapshot();
}

/* On open: rebuild the last session from the saved log. Returns a message, or null if nothing was saved. */
async function restoreSaved() {
  const log = await storeGet('log');
  if (!log || !log.primary || !log.primary.length) return null;
  try {
    const ok = importTexts(log.primary, null, { restore: true });
    if (!ok) return { error: 'Your saved data could not be loaded again, so the demo season is showing. Import your files again in the Data tab.' };
    (log.fbref || []).forEach((f) => { if (DB.teamById[f.team]) addFbref(f.texts, f.team, null, { restore: true }); });
    applyLayers(log.layers);
    (log.manual || []).forEach((e) => applyManual(DB, e));
    cache.clear();
    DB.manual = (log.manual || []).slice();
    STORE.meta = savedSummary(log);
    return { ok: true };
  } catch (e) {
    return { error: 'Your saved data could not be loaded again (' + e.message + '), so the demo season is showing.' };
  }
}

/* Past seasons added in this browser: season ("2024/25") -> { primary: [season file], layers: [Sportmonks files] },
   kept apart from the current season's log so adding an old season never replaces it. */
async function pastGet() { return (await storeGet('past')) || {}; }
async function pastPut(season, change) {
  const all = await pastGet();
  const cur = all[season] || { primary: [], layers: [] };
  all[season] = change(cur) || cur;
  all[season].savedAt = Date.now();
  return storeSet('past', all);
}
const pastAddPrimary = (season, texts) => pastPut(season, (c) => ({ ...c, primary: texts.map((t) => ({ name: t.name, text: t.text })) }));
const pastAddLayer = (season, f) => pastPut(season, (c) => ({ ...c, layers: (c.layers || []).filter((l) => l.name !== f.name).concat({ name: f.name, text: f.text }) }));
async function pastRemove(season) { const all = await pastGet(); delete all[season]; return storeSet('past', all); }

/* Attendance files (Wikipedia), kept apart from the season logs */
async function saveAttendanceFile(f) {
  const list = ((await storeGet('attendance')) || []).filter((x) => x.name !== f.name).concat({ name: f.name, text: f.text });
  return storeSet('attendance', list);
}
async function restoreAttendance() {
  if (SNAP && SNAP.attendance) [].concat(SNAP.attendance).forEach(addAttendanceFile);
  ((await storeGet('attendance')) || []).forEach((f) => { try { addAttendanceFile(JSON.parse(f.text)); } catch (e) { /* skip a damaged file */ } });
}

/* Club histories (Wikipedia season lists), kept apart from the season logs */
async function saveClubHistory(f) {
  const list = ((await storeGet('clubhist')) || []).filter((x) => x.name !== f.name).concat({ name: f.name, text: f.text });
  return storeSet('clubhist', list);
}
async function restoreClubHistory() {
  if (SNAP && SNAP.clubHistory) [].concat(SNAP.clubHistory).forEach(addClubHistory);
  ((await storeGet('clubhist')) || []).forEach((f) => { try { addClubHistory(JSON.parse(f.text)); } catch (e) { /* skip a damaged file */ } });
}
